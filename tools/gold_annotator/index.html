<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Gold Set Annotator</title>
<style>
  :root { --bg:#14161a; --panel:#1e2229; --fg:#e6e6e6; --dim:#8a919c; --acc:#4da3ff;
          --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,sans-serif; height:100vh; display:flex; flex-direction:column; }
  #top { display:flex; align-items:center; gap:12px; padding:8px 14px; background:var(--panel); }
  #progresswrap { flex:1; height:10px; background:#000; border-radius:5px; overflow:hidden; }
  #progressbar { height:100%; width:0; background:var(--acc); transition:width .15s; }
  #main { flex:1; display:flex; min-height:0; }
  #imgcol { flex:1.3; display:flex; align-items:center; justify-content:center; padding:10px; min-width:0; position:relative; }
  #cropimg { max-width:100%; max-height:100%; image-rendering:auto; border:1px solid #333; }
  #framecanvas { max-width:100%; max-height:100%; border:1px solid #333; display:none; }
  #viewtag { position:absolute; top:14px; left:18px; background:#0009; padding:2px 8px; border-radius:4px; color:var(--dim); font-size:12px; }
  #panel { width:430px; overflow-y:auto; background:var(--panel); padding:12px 14px; }
  .field { margin-bottom:8px; border-radius:6px; padding:5px 8px; border:1px solid transparent; }
  .field.active { border-color:var(--acc); background:#243040; }
  .fname { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .fkey { color:var(--acc); font-weight:700; margin-right:6px; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:3px; }
  .chip { padding:2px 8px; border-radius:10px; background:#2c313a; cursor:pointer; font-size:12.5px; color:var(--dim); }
  .chip.sel { background:var(--acc); color:#04121f; font-weight:600; }
  .chip.edited { outline:2px solid var(--warn); }
  .bools { display:flex; gap:6px; margin:10px 0; flex-wrap:wrap; }
  .bool { padding:4px 10px; border-radius:6px; background:#2c313a; cursor:pointer; color:var(--dim); }
  .bool.on { background:var(--ok); color:#03170a; font-weight:600; }
  #caption { color:var(--dim); font-style:italic; margin:8px 0; font-size:13px; }
  #meta { color:var(--dim); font-size:12px; margin-bottom:8px; word-break:break-all; }
  #status { font-weight:700; }
  #keymap { margin-top:12px; border-top:1px solid #333; padding-top:8px; color:var(--dim); font-size:12px; }
  #keymap b { color:var(--fg); }
  kbd { background:#2c313a; border-radius:3px; padding:0 5px; color:var(--acc); font-family:monospace; }
  #flash { position:fixed; bottom:16px; right:16px; padding:6px 14px; border-radius:6px; background:var(--ok);
           color:#03170a; font-weight:700; opacity:0; transition:opacity .3s; }
</style>
</head>
<body>
<div id="top">
  <span id="counter">–</span>
  <div id="progresswrap"><div id="progressbar"></div></div>
  <span id="annotator"></span>
  <span id="status"></span>
</div>
<div id="main">
  <div id="imgcol">
    <span id="viewtag">crop view — <kbd>f</kbd> for source frame</span>
    <img id="cropimg">
    <canvas id="framecanvas"></canvas>
  </div>
  <div id="panel">
    <div id="meta"></div>
    <div id="caption"></div>
    <div id="fields"></div>
    <div class="bools" id="bools"></div>
    <div id="keymap">
      <b>Keys:</b>
      <kbd>1</kbd>–<kbd>6</kbd> select field &nbsp; <kbd>j</kbd>/<kbd>k</kbd> or <kbd>↓</kbd>/<kbd>↑</kbd> cycle value<br>
      <kbd>q</kbd> phone <kbd>w</kbd> laptop <kbd>e</kbd> talking <kbd>r</kbd> occluded (toggle)<br>
      <kbd>space</kbd>/<kbd>enter</kbd> accept &amp; next &nbsp; <kbd>u</kbd> uncertain &nbsp; <kbd>x</kbd> reject image<br>
      <kbd>←</kbd>/<kbd>→</kbd> prev/next (no save) &nbsp; <kbd>g</kbd> next unannotated &nbsp; <kbd>f</kbd> toggle frame view
    </div>
  </div>
</div>
<div id="flash">saved</div>
<script>
"use strict";
let VOCAB={}, BOOLS=[], TOTAL=0, idx=0, item=null, fields={}, activeField=0, frameMode=false;
const CATS=[]; // ordered categorical field names

async function jget(u){ const r=await fetch(u); return r.json(); }

function render(){
  const catDiv=document.getElementById('fields'); catDiv.innerHTML='';
  CATS.forEach((f,i)=>{
    const d=document.createElement('div');
    d.className='field'+(i===activeField?' active':'');
    d.onclick=()=>{activeField=i; render();};
    const edited = item.annotation===null && fields[f]!==item[f];
    d.innerHTML=`<span class="fname"><span class="fkey">${i+1}</span>${f}</span>`;
    const chips=document.createElement('div'); chips.className='chips';
    VOCAB[f].forEach(v=>{
      const c=document.createElement('span');
      c.className='chip'+(fields[f]===v?' sel':'')+((fields[f]===v&&edited)?' edited':'');
      c.textContent=v;
      c.onclick=(ev)=>{ev.stopPropagation(); fields[f]=v; activeField=i; render();};
      chips.appendChild(c);
    });
    d.appendChild(chips); catDiv.appendChild(d);
  });
  const bd=document.getElementById('bools'); bd.innerHTML='';
  const bkeys={phone_visible:'q',laptop_visible:'w',talking:'e',occluded:'r'};
  BOOLS.forEach(b=>{
    const d=document.createElement('span');
    d.className='bool'+(fields[b]?' on':'');
    d.innerHTML=`<kbd>${bkeys[b]||''}</kbd> ${b}: ${fields[b]}`;
    d.onclick=()=>{fields[b]=!fields[b]; render();};
    bd.appendChild(d);
  });
  document.getElementById('caption').textContent='“'+(item.caption||'')+'”  (conf '+(item.model_confidence??'?')+')';
  document.getElementById('meta').textContent=`#${idx}  ${item.file_name}  det_conf=${(item.det_conf||0).toFixed(2)} head_kpts=${item.head_kpts} face_kpts=${item.face_kpts}`;
  const st=document.getElementById('status');
  if(item.annotation){ st.textContent='['+item.annotation.status+']'; st.style.color=item.annotation.status==='ok'?'var(--ok)':item.annotation.status==='rejected'?'var(--bad)':'var(--warn)'; }
  else { st.textContent='[unannotated]'; st.style.color='var(--dim)'; }
}

function renderProgress(s){
  document.getElementById('counter').textContent=`${s.done}/${s.total}`;
  document.getElementById('progressbar').style.width=(100*s.done/s.total)+'%';
  document.getElementById('annotator').textContent='annotator: '+s.annotator;
}

async function load(i){
  idx=Math.max(0,Math.min(TOTAL-1,i));
  item=await jget('/api/item/'+idx);
  fields={};
  const src=item.annotation||item;
  CATS.concat(BOOLS).forEach(f=>{fields[f]=src[f];});
  frameMode=false; showImage();
  render();
}

function showImage(){
  const img=document.getElementById('cropimg'), cv=document.getElementById('framecanvas'),
        tag=document.getElementById('viewtag');
  if(!frameMode){
    img.style.display='block'; cv.style.display='none';
    img.src='/img/crop/'+idx;
    tag.innerHTML='crop view — <kbd>f</kbd> for source frame';
  }else{
    img.style.display='none'; cv.style.display='block';
    tag.innerHTML='frame view (red box = this student) — <kbd>f</kbd> for crop';
    const f=new Image();
    f.onload=()=>{
      cv.width=f.width; cv.height=f.height;
      const g=cv.getContext('2d');
      g.drawImage(f,0,0);
      if(item.bbox_person){
        const [x1,y1,x2,y2]=item.bbox_person;
        g.lineWidth=6; g.strokeStyle='#f85149'; g.strokeRect(x1,y1,x2-x1,y2-y1);
      }
    };
    f.src='/img/frame/'+idx;
  }
}

async function save(status){
  const r=await fetch('/api/annotate',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({index:idx,status:status,fields:fields})});
  const j=await r.json();
  renderProgress(j.state);
  const fl=document.getElementById('flash');
  fl.textContent=status==='ok'?'saved':status; fl.style.opacity=1;
  setTimeout(()=>fl.style.opacity=0,500);
  await load(idx+1<TOTAL?idx+1:idx);
}

async function nextUnannotated(){
  const s=await jget('/api/state'); renderProgress(s); await load(s.next_index);
}

document.addEventListener('keydown',async ev=>{
  if(ev.target.tagName==='INPUT') return;
  const k=ev.key;
  if(k>='1'&&k<='6'){activeField=parseInt(k)-1; render();}
  else if(k==='j'||k==='ArrowDown'||k==='k'||k==='ArrowUp'){
    ev.preventDefault();
    const f=CATS[activeField], opts=VOCAB[f];
    let p=opts.indexOf(fields[f]);
    p=(k==='j'||k==='ArrowDown')?(p+1)%opts.length:(p-1+opts.length)%opts.length;
    fields[f]=opts[p]; render();
  }
  else if(k==='q'){fields.phone_visible=!fields.phone_visible; render();}
  else if(k==='w'){fields.laptop_visible=!fields.laptop_visible; render();}
  else if(k==='e'){fields.talking=!fields.talking; render();}
  else if(k==='r'){fields.occluded=!fields.occluded; render();}
  else if(k===' '||k==='Enter'){ev.preventDefault(); await save('ok');}
  else if(k==='u'){await save('uncertain');}
  else if(k==='x'){await save('rejected');}
  else if(k==='ArrowLeft'){await load(idx-1);}
  else if(k==='ArrowRight'){await load(idx+1);}
  else if(k==='g'){await nextUnannotated();}
  else if(k==='f'){frameMode=!frameMode; showImage();}
});

(async()=>{
  const s=await jget('/api/state');
  VOCAB=s.vocab; BOOLS=s.booleans; TOTAL=s.total;
  Object.keys(VOCAB).forEach(f=>CATS.push(f));
  renderProgress(s);
  await load(s.next_index);
})();
</script>
</body>
</html>
